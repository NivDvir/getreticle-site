<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0f13" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="https://getreticle.com/impressum/">
  <title>Impressum</title>
  <meta name="description" content="Impressum von getreticle.com.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Ccircle%20cx='16'%20cy='16'%20r='11'%20fill='none'%20stroke='%23e8552b'%20stroke-width='3'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='4.5'%20fill='%23e8552b'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #16181d;
      --fg-soft: #4a4f5a;
      --fg-faint: #6b7280;
      --accent: #e8552b;
      --link: #b93f17;
      --border: #e4e6eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0f13;
        --fg: #f2f4f8;
        --fg-soft: #b6bcc8;
        --fg-faint: #858c9a;
        --accent: #ff6a3d;
        --link: #ff6a3d;
        --border: #232830;
      }
    }
    :root[data-theme="light"] {
      --bg: #ffffff; --fg: #16181d; --fg-soft: #4a4f5a; --fg-faint: #6b7280;
      --accent: #e8552b; --link: #b93f17; --border: #e4e6eb;
    }
    :root[data-theme="dark"] {
      --bg: #0d0f13; --fg: #f2f4f8; --fg-soft: #b6bcc8; --fg-faint: #858c9a;
      --accent: #ff6a3d; --link: #ff6a3d; --border: #232830;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      font-size: 17px;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--link); text-decoration: underline; text-underline-offset: 2px; }
    a:focus-visible { outline: 3px solid var(--link); outline-offset: 3px; border-radius: 3px; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }

    header.top { padding: 56px 0 8px; }
    .brand {
      display: inline-flex; align-items: center; gap: 10px;
      font-weight: 700; letter-spacing: -0.01em; font-size: 15px;
      color: var(--fg-faint); text-transform: uppercase;
    }
    .brand .dot {
      width: 12px; height: 12px; border-radius: 50%;
      border: 2.5px solid var(--accent);
      position: relative;
    }
    .brand .dot::after {
      content: ""; position: absolute; inset: 2.5px;
      border-radius: 50%; background: var(--accent);
    }

    section { padding: 40px 0; border-top: 1px solid var(--border); }
    section:first-of-type { border-top: none; }
    .title {
      font-size: clamp(28px, 5.5vw, 40px);
      line-height: 1.15;
      letter-spacing: -0.025em;
      margin: 0 0 22px;
      font-weight: 800;
      color: var(--fg);
    }
    .sub {
      font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--fg-faint); margin: 32px 0 12px; font-weight: 700;
    }
    p { margin: 0 0 18px; color: var(--fg-soft); }
    .lede { font-size: clamp(17px, 2.4vw, 20px); color: var(--fg-soft); }
    ul { margin: 0 0 18px; padding-left: 1.2em; color: var(--fg-soft); }
    li { margin: 0 0 8px; }
    li::marker { color: var(--fg-faint); }

    footer {
      border-top: 1px solid var(--border);
      padding: 28px 0 48px;
      text-align: center;
      color: var(--fg-faint);
      font-size: 14px;
    }
    footer p { color: var(--fg-faint); margin: 0 0 8px; }
    .en { display: block; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--fg-soft); }
    .stand { font-size: 15px; }
  </style>
</head>
<body>
  <div class="wrap">

    <header class="top">
      <div class="brand"><span class="dot" aria-hidden="true"></span> Reticle</div>
    </header>

    <main>
      <section>
        <h1 class="title">Impressum</h1>
        <p>Angaben gemäß § 5 DDG</p>

        <h2 class="sub">Name <span class="en" lang="en">Name</span></h2>
        <p>Niv Dvir</p>

        <h2 class="sub">Anschrift <span class="en" lang="en">Address</span></h2>
        <p>Sachlav St. 3A<br>7420233 Ness Ziona<br>Israel</p>

        <h2 class="sub">Kontakt <span class="en" lang="en">Contact</span></h2>
        <p>E-Mail: <a href="mailto:niv@getreticle.com">niv@getreticle.com</a><br>
        <a href="/access/#kontakt">Kontaktformular</a></p>
      </section>
    </main>

    <footer>
      <p><a href="/">getreticle.com</a></p>
      <p><a href="/impressum/">Impressum</a> &middot; <a href="/datenschutz/">Datenschutz</a></p>
    </footer>

  </div>
</body>
</html>
