  <link rel="canonical" href="https://getreticle.com/impressum/">
  <title>Impressum</title>

  <style>
    :root {
      --bg: #ffffff;
      --fg: #16181d;
      --fg-soft: #4a4f5a;
      --fg-faint: #6b7280;
      --accent: #e8552b;
      --link: #b93f17;
      --border: #e4e6eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0f13;
        --fg: #f2f4f8;
        --fg-soft: #b6bcc8;
        --fg-faint: #858c9a;
        --accent: #ff6a3d;
        --link: #ff6a3d;
        --border: #232830;
      }
    }
    :root[data-theme="light"] {
      --bg: #ffffff; --fg: #16181d; --fg-soft: #4a4f5a; --fg-faint: #6b7280;
      --accent: #e8552b; --link: #b93f17; --border: #e4e6eb;
    }
    :root[data-theme="dark"] {
      --bg: #0d0f13; --fg: #f2f4f8; --fg-soft: #b6bcc8; --fg-faint: #858c9a;
      --accent: #ff6a3d; --link: #ff6a3d; --border: #232830;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      font-size: 17px;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--link); text-decoration: underline; text-underline-offset: 2px; }
    a:focus-visible { outline: 3px solid var(--link); outline-offset: 3px; border-radius: 3px; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }

    header.top { padding: 56px 0 8px; }
    .brand {
      display: inline-flex; align-items: center; min-height: 61px;
      line-height: 0; text-decoration: none;
    }
    .brand svg { display: block; width: 190px; height: 61px; transform: translateY(3px); }
    .brand:focus-visible { outline: 3px solid var(--link); outline-offset: 3px; border-radius: 4px; }
    @media (max-width: 399px) { .brand svg { width: 150px; height: 48px; transform: translateY(2px); } .brand { min-height: 48px; } }

    section { padding: 40px 0; border-top: 1px solid var(--border); }
    section:first-of-type { border-top: none; }
    .title {
      font-size: clamp(28px, 5.5vw, 40px);
      line-height: 1.15;
      letter-spacing: -0.025em;
      margin: 0 0 22px;
      font-weight: 800;
      color: var(--fg);
    }
    .sub {
      font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--fg-faint); margin: 32px 0 12px; font-weight: 700;
    }
    p { margin: 0 0 18px; color: var(--fg-soft); }
    .lede { font-size: clamp(17px, 2.4vw, 20px); color: var(--fg-soft); }
    ul { margin: 0 0 18px; padding-left: 1.2em; color: var(--fg-soft); }
    li { margin: 0 0 8px; }
    li::marker { color: var(--fg-faint); }

    footer {
      border-top: 1px solid var(--border);
      padding: 28px 0 48px;
      text-align: center;
      color: var(--fg-faint);
      font-size: 14px;
    }
    footer p { color: var(--fg-faint); margin: 0 0 8px; }
    .en { display: block; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--fg-soft); }
    .stand { font-size: 15px; }
  </style>
</head>
